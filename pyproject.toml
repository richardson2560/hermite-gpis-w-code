[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hgw"
version = "0.1.0"
description = "Hermite-GPIS-W: compactly supported GPIS for geometric inference"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "trimesh>=4.0",
]

[tool.setuptools.packages.find]
include = ["hgw*"]